{% extends "base.html" %}

{% block title %}Patient Detail{% endblock %}

{% block body_class %}doctor-patient-detail{% endblock %}

{% block navbar %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="{{ url_for('doctor.dashboard') }}">
            <img src="{{ url_for('static', filename='img/logo-white.png') }}" alt="SwasthAI" height="32" class="d-inline-block me-2">
        </a>
        <div class="navbar-nav ms-auto">
            <a class="btn btn-outline-light btn-sm" href="{{ url_for('doctor.dashboard') }}">
                <i class="bi bi-arrow-left me-1"></i>Back to Queue
            </a>
        </div>
    </div>
</nav>
{% endblock %}

{% block content %}
<div class="container py-4">
    <div id="patientContent">
        <div class="text-center py-5">
            <div class="spinner-border"></div>
            <p>Loading patient details...</p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const patientId = {{ patient_id }};

async function loadPatient() {
    try {
        const response = await fetch('/api/patient/' + patientId);
        const patient = await response.json();
        renderPatient(patient);
    } catch (error) {
        document.getElementById('patientContent').innerHTML = `
            <div class="alert alert-danger">Error loading patient details</div>
        `;
    }
}

function renderPatient(patient) {
    // Full patient detail page implementation
    document.getElementById('patientContent').innerHTML = `
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4>Patient #${patient.id} - ${patient.name}</h4>
            </div>
            <div class="card-body">
                <p>Full patient details will be displayed here.</p>
                <pre>${JSON.stringify(patient, null, 2)}</pre>
            </div>
        </div>
    `;
}

loadPatient();
</script>
{% endblock %}
