{% extends "base.html" %}

{% block title %}Change Password{% endblock %}

{% block body_class %}doctor-change-password{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center min-vh-100 align-items-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-key-fill text-primary" style="font-size: 3rem;"></i>
                        <h3 class="mt-3" data-i18n="changePassword">Change Password</h3>
                        <p class="fw-medium text-muted-light">{{ session.doctor_name }}</p>
                    </div>

                    <div id="errorAlert" class="alert alert-danger d-none"></div>
                    <div id="successAlert" class="alert alert-success d-none"></div>

                    <form id="changePasswordForm">
                        <div class="mb-3">
                            <label class="form-label" data-i18n="currentPassword">Current Password</label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="currentPassword" required>
                                <button class="btn btn-outline-secondary" type="button"
                                    onclick="togglePasswordVisibility('currentPassword', 'icon0')"
                                    title="Show/hide password">
                                    <i class="bi bi-eye" id="icon0"></i>
                                </button>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" data-i18n="newPassword">New Password</label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="newPassword" required minlength="8">
                                <button class="btn btn-outline-secondary" type="button"
                                    onclick="togglePasswordVisibility('newPassword', 'icon1')"
                                    title="Show/hide password">
                                    <i class="bi bi-eye" id="icon1"></i>
                                </button>
                            </div>
                            <div class="form-text" data-i18n="passwordRequirements">At least 8 characters</div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label" data-i18n="confirmPassword">Confirm New Password</label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="confirmPassword" required>
                                <button class="btn btn-outline-secondary" type="button"
                                    onclick="togglePasswordVisibility('confirmPassword', 'icon2')"
                                    title="Show/hide password">
                                    <i class="bi bi-eye" id="icon2"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2" id="submitBtn">
                            <i class="bi bi-check-circle me-2"></i><span data-i18n="updatePassword">Update Password</span>
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <a href="/doctor/dashboard" class="text-decoration-none" data-i18n="backToDashboard">← Back to Dashboard</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function togglePasswordVisibility(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('bi-eye', 'bi-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.replace('bi-eye-slash', 'bi-eye');
    }
}
document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const errorAlert = document.getElementById('errorAlert');
    const successAlert = document.getElementById('successAlert');
    const submitBtn = document.getElementById('submitBtn');
    
    errorAlert.classList.add('d-none');
    successAlert.classList.add('d-none');
    
    const currentPassword = document.getElementById('currentPassword').value;
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    
    if (newPassword !== confirmPassword) {
        errorAlert.textContent = 'New passwords do not match';
        errorAlert.classList.remove('d-none');
        return;
    }
    
    if (newPassword.length < 8) {
        errorAlert.textContent = 'Password must be at least 8 characters';
        errorAlert.classList.remove('d-none');
        return;
    }
    
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Updating...';
    
    try {
        const response = await fetch('/doctor/change-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                current_password: currentPassword,
                new_password: newPassword
            })
        });
        
        let data = {};
        try {
            data = await response.json();
        } catch (parseErr) {
            throw new Error(`Server error (HTTP ${response.status}). Please try again.`);
        }
        
        if (response.ok) {
            successAlert.textContent = 'Password updated successfully!';
            successAlert.classList.remove('d-none');
            document.getElementById('changePasswordForm').reset();
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="bi bi-check-circle me-2"></i>Update Password';
        } else {
            errorAlert.textContent = data.error || 'Failed to update password';
            errorAlert.classList.remove('d-none');
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="bi bi-check-circle me-2"></i>Update Password';
        }
    } catch (error) {
        errorAlert.textContent = error.message || 'Network error. Please try again.';
        errorAlert.classList.remove('d-none');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="bi bi-check-circle me-2"></i>Update Password';
    }
});
</script>
{% endblock %}
