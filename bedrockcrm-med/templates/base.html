<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SwasthAI{% endblock %} - Medical Triage System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <style>
        .lang-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1050;
            background: rgba(255,255,255,0.95);
            border: 2px solid var(--primary);
            color: var(--primary);
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        .lang-toggle:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        .landing-page .lang-toggle {
            background: rgba(255,255,255,0.25);
            border-color: white;
            border-width: 2px;
            color: white;
            font-weight: 600;
            backdrop-filter: blur(10px);
        }
        .landing-page .lang-toggle:hover {
            background: white;
            color: var(--primary);
        }
        /* Hide language toggle on admin/doctor pages - not needed there */
        .superadmin-login-page .lang-toggle,
        .superadmin-dashboard .lang-toggle,
        .doctor-login-page .lang-toggle,
        body[class*="doctor-"] .lang-toggle,
        body[class*="superadmin-"] .lang-toggle,
        /* Hide floating toggle on landing page - it has its own dropdown */
        .landing-page .lang-toggle {
            display: none !important;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <!-- Language Toggle Button (patient-facing pages only) -->
    <button class="btn lang-toggle" data-lang-toggle>
        हिंदी
    </button>
    
    {% block navbar %}{% endblock %}
    
    <main>
        {% block content %}{% endblock %}
    </main>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/translations.js') }}"></script>
    <script>
    // ─────────────────────────────────────────────────────────────
    // Global date utilities — available on every page
    //
    // Problem: new Date("2026-02-26T20:03:24") is parsed as LOCAL
    //   time in some browsers (Firefox, Safari) and UTC in others.
    //   This causes times to appear correct on one device and wrong
    //   on another, or wrong when the server and browser are in
    //   different timezones.
    //
    // Fix: parseUTCDate() appends 'Z' to any datetime string that
    //   has no timezone info, forcing UTC interpretation everywhere.
    //   formatDateTime() then converts to the browser's local time.
    // ─────────────────────────────────────────────────────────────
    window.parseUTCDate = function(s) {
        if (!s) return null;
        if (typeof s === 'number') return new Date(s);
        // Only datetime strings (with 'T') need normalization.
        // Date-only strings like "2026-02-27" are spec'd as UTC already.
        if (typeof s === 'string' && s.includes('T')
                && !s.endsWith('Z') && !/[+-]\d{2}:?\d{2}$/.test(s)) {
            s = s + 'Z';
        }
        return new Date(s);
    };

    window.formatDateTime = function(s) {
        const d = window.parseUTCDate(s);
        if (!d || isNaN(d.getTime())) return '\u2014';
        return d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
    };
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
