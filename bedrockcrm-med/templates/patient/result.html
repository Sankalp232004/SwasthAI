{% extends "base.html" %}

{% block title %}Triage Result{% endblock %}

{% block body_class %}result-page{% endblock %}

{% block navbar %}
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="{{ url_for('patient.index') }}">
            <img src="{{ url_for('static', filename='img/logo-white.png') }}" alt="SwasthAI" height="32" class="d-inline-block me-2">
        </a>
    </div>
</nav>
{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div id="resultCard" class="card shadow result-card">
                <div class="card-body text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-3" data-i18n="res.loading">Loading your triage result...</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const patientId = {{ patient_id }};
const clinicSlug = '{{ clinic.slug }}';

let lastPatientData = null;

async function loadResult() {
    try {
        const response = await fetch('/api/patient/' + patientId);
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const patient = await response.json();
        
        lastPatientData = patient;
        renderResult(patient);
    } catch (error) {
        document.getElementById('resultCard').innerHTML = `
            <div class="card-body text-center py-5">
                <i class="bi bi-exclamation-circle text-danger" style="font-size: 3rem;"></i>
                <p class="mt-3">Error loading result. Please try again.</p>
            </div>
        `;
    }
}

// Re-render on language change (patient data is cached in lastPatientData)
document.addEventListener('languageChanged', function() {
    if (lastPatientData) renderResult(lastPatientData);
});

function renderResult(patient) {
    const priority = patient.priority;
    const reasons = patient.clinical_data?.triage_result?.reasons || [];
    const redFlags = patient.clinical_data?.triage_result?.red_flags || [];
    
    const t = window.t || ((k, fb) => fb);
    
    let priorityClass, priorityIcon, priorityMessage;
    
    const _priorityLabels = {
        'EMERGENCY': t('priority.emergency', 'Emergency'),
        'RED':       t('priority.red',       'Critical'),
        'AMBER':     t('priority.amber',     'Urgent'),
        'GREEN':     t('priority.green',     'Routine')
    };
    const priorityLabel = _priorityLabels[priority] || priority || 'Unknown';

    switch(priority) {
        case 'EMERGENCY':
            priorityClass = 'priority-emergency';
            priorityIcon = 'bi-exclamation-triangle-fill';
            priorityMessage = t('res.emergency_msg', 'IMMEDIATE ATTENTION REQUIRED');
            break;
        case 'RED':
            priorityClass = 'priority-red';
            priorityIcon = 'bi-heart-fill';
            priorityMessage = t('res.red_msg', 'Please proceed to the triage desk immediately');
            break;
        case 'AMBER':
            priorityClass = 'priority-amber';
            priorityIcon = 'bi-clock-fill';
            priorityMessage = t('res.amber_msg', 'You will be seen soon');
            break;
        case 'GREEN':
            priorityClass = 'priority-green';
            priorityIcon = 'bi-check-circle-fill';
            priorityMessage = t('res.green_msg', 'Please wait comfortably to be called');
            break;
        default:
            priorityClass = 'priority-green';
            priorityIcon = 'bi-circle';
            priorityMessage = priority || 'Routine';
    }
    
    let redFlagsHtml = '';
    if (redFlags && redFlags.length > 0) {
        redFlagsHtml = `
            <div class="alert alert-danger mt-4">
                <h5><i class="bi bi-exclamation-triangle-fill me-2"></i>${t('res.red_flags', 'Red Flags Detected')}</h5>
                <ul class="mb-0">
                    ${redFlags.map(flag => `<li>${flag}</li>`).join('')}
                </ul>
            </div>
        `;
    }
    
    document.getElementById('resultCard').innerHTML = `
        <div class="card-header ${priorityClass} text-white text-center py-4">
            <i class="bi ${priorityIcon}" style="font-size: 4rem;"></i>
            <h1 class="display-4 mt-3 mb-2">${priorityLabel}</h1>
            <p class="lead mb-0">${priorityMessage}</p>
        </div>
        <div class="card-body p-4">
            <div class="row mb-4">
                <div class="col-md-6">
                    <h5>${t('res.patient_info', 'Patient Information')}</h5>
                    <table class="table table-sm">
                        <tr><td><strong>${t('apt.name', 'Name:')}</strong></td><td>${patient.name}</td></tr>
                        <tr><td><strong>${t('reg.age', 'Age')}:</strong></td><td>${patient.age}</td></tr>
                        <tr><td><strong>${t('res.token', 'Token #:')}</strong></td><td><strong class="text-primary">${patient.daily_token || patient.id}</strong></td></tr>
                        <tr><td><strong>${t('res.status_label', 'Status:')}</strong></td><td><span class="badge bg-info text-white">${patient.status}</span></td></tr>
                    </table>
                </div>
                <div class="col-md-6">
                    <h5>${t('res.complaint', 'Complaint')}</h5>
                    <p class="fw-medium text-dark">${patient.complaint}</p>
                    <p class="small fw-medium text-muted-light">
                        <i class="bi bi-clock me-1"></i>
                        ${t('res.registered', 'Registered:')} ${patient.created_at_local || formatDateTime(patient.created_at)}
                    </p>
                </div>
            </div>
            
            ${redFlagsHtml}
            
            <div class="mt-4">
                <h5><i class="bi bi-list-check me-2"></i>${t('res.assessment', 'Assessment Reasons')}</h5>
                <ul class="list-group">
                    ${reasons.map(reason => `
                        <li class="list-group-item">
                            <i class="bi bi-arrow-right me-2 text-primary"></i>${reason}
                        </li>
                    `).join('')}
                </ul>
            </div>
            
            <div class="alert alert-info mt-4">
                <i class="bi bi-info-circle me-2"></i>
                <strong>${t('res.token', 'Token #:')} ${patient.daily_token || patient.id}.</strong>
            </div>
            
            <div class="mt-4 p-4 bg-light rounded">
                <h5 class="text-center mb-4"><i class="bi bi-calendar-check me-2"></i>${t('res.what_to_do', 'What would you like to do?')}</h5>
                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="card h-100 border-primary">
                            <div class="card-body text-center">
                                <i class="bi bi-hospital text-primary" style="font-size: 3rem;"></i>
                                <h5 class="mt-3">${t('res.walk_in_now', 'Walk-in Now')}</h5>
                                <p class="fw-medium text-muted-light">${t('res.walk_in_desc', 'Join the queue and wait for your turn')}</p>
                                <a href="/c/${clinicSlug}/waiting/${patient.id}" class="btn btn-primary">
                                    <i class="bi bi-person-walking me-2"></i>${t('res.go_waiting', 'Go to Waiting Room')}
                                </a>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card h-100 border-success">
                            <div class="card-body text-center">
                                <i class="bi bi-calendar-check text-success" style="font-size: 3rem;"></i>
                                <h5 class="mt-3">${t('res.book_appt', 'Book Appointment')}</h5>
                                <p class="fw-medium text-muted-light">${t('res.book_desc', 'Choose a time slot for later')}</p>
                                <a href="/c/${clinicSlug}/book-appointment/${patient.id}" class="btn btn-success">
                                    <i class="bi bi-clock-history me-2"></i>${t('res.select_slot', 'Select Time Slot')}
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="text-center mt-4">
                <a href="/c/${clinicSlug}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-2"></i>${t('apt.back_home', 'Back to Home')}
                </a>
            </div>
        </div>
    `;
}

loadResult();
</script>

<style>
.priority-emergency { background: linear-gradient(135deg, #8B0000, #DC143C); }
.priority-red { background: linear-gradient(135deg, #C0392B, #E74C3C); }
.priority-amber { background: linear-gradient(135deg, #D68910, #F39C12); }
.priority-green { background: linear-gradient(135deg, #1E8449, #27AE60); }
</style>
{% endblock %}
