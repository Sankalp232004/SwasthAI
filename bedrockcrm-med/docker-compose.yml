services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: swasthai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: swasthai
      POSTGRES_USER: swasthai
      POSTGRES_PASSWORD: swasthai_secret_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swasthai -d swasthai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flask Application
  web:
    build: .
    container_name: swasthai-web
    restart: unless-stopped
    ports:
      - "5010:5000"
    environment:
      - DATABASE_URL=postgresql://swasthai:swasthai_secret_password@db:5432/swasthai
      - SECRET_KEY=change-this-in-production-use-strong-key
      - FLASK_ENV=development
      # Twilio Configuration (add your credentials here)
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mount source code for development (hot reload)
      - .:/app

  # ngrok tunnel is managed by the host Mac as a launchd service.
  # Permanent public URL: https://receptual-concussant-tisha.ngrok-free.dev
  # To restart manually: ngrok http --domain=receptual-concussant-tisha.ngrok-free.dev 5010

  # Adminer - PostgreSQL Web UI
  adminer:
    image: adminer:latest
    container_name: swasthai-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=db
      - ADMINER_DESIGN=pepa-linha
    depends_on:
      - db

volumes:
  postgres_data:
