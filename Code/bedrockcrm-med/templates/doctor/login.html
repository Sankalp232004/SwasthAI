{% extends "base.html" %}

{% block title %}Doctor Login{% endblock %}

{% block body_class %}doctor-login-page{% endblock %}

{% block content %}
<div class="login-container">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-5">
                <div class="card shadow-lg border-0">
                    <div class="card-header bg-dark text-white text-center py-4">
                        <i class="bi bi-shield-lock" style="font-size: 2.5rem;"></i>
                        <h3 class="mt-2 mb-0" data-i18n="doctor.portal">Doctor Portal</h3>
                        <p class="mb-0 fw-medium" style="color: rgba(255,255,255,0.85);"><span data-i18n="app.name">SwasthAI</span> <span data-i18n="app.tagline">Medical Triage System</span></p>
                    </div>
                    <div class="card-body p-4">
                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" id="emailInput" name="email" required
                                        placeholder="doctor@clinic.com" autocomplete="username">
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-key"></i></span>
                                    <input type="password" class="form-control" id="passwordInput" name="password" required
                                        placeholder="Enter your password" autocomplete="current-password">
                                    <button class="btn btn-outline-secondary" type="button" id="togglePassword"
                                        onclick="togglePasswordVisibility('passwordInput', 'togglePasswordIcon')"
                                        title="Show/hide password">
                                        <i class="bi bi-eye" id="togglePasswordIcon"></i>
                                    </button>
                                </div>
                            </div>
                            
                            <div id="errorAlert" class="alert alert-danger d-none"></div>
                            
                            <button type="submit" class="btn btn-primary w-100 py-2">
                                <i class="bi bi-box-arrow-in-right me-2"></i><span data-i18n="doctor.login_btn">Sign In</span>
                            </button>
                        </form>
                    </div>
                    <div class="card-footer bg-light text-center py-3">
                        <a href="{{ url_for('patient.index') }}" class="text-decoration-none">
                            <i class="bi bi-arrow-left me-1"></i><span data-i18n="btn.back">Back to Home</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function togglePasswordVisibility(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('bi-eye', 'bi-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.replace('bi-eye-slash', 'bi-eye');
    }
}

document.addEventListener('DOMContentLoaded', function() {
    // Clear fields to prevent browser from autofilling credentials from other sessions
    document.getElementById('emailInput').value = '';
    document.getElementById('passwordInput').value = '';
});

document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const errorAlert = document.getElementById('errorAlert');
    errorAlert.classList.add('d-none');
    
    const email = this.email.value;
    const password = this.password.value;
    
    try {
        const response = await fetch('/api/doctor/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email, password })
        });
        
        const data = await response.json();
        
        if (response.ok) {
            window.location.href = '/doctor/dashboard';
        } else {
            errorAlert.textContent = data.error;
            errorAlert.classList.remove('d-none');
        }
    } catch (error) {
        errorAlert.textContent = 'Network error. Please try again.';
        errorAlert.classList.remove('d-none');
    }
});
</script>
{% endblock %}
