services:
  web:
    build: .
    container_name: swasthai-web-free
    restart: unless-stopped
    ports:
      - "5010:5000"
    environment:
      - DATABASE_URL=sqlite:////data/swasthai.db
      - SECRET_KEY=${SECRET_KEY:-change-this-before-sharing-publicly}
      - FLASK_ENV=production
      - APP_BASE_URL=${APP_BASE_URL:-http://127.0.0.1:5010}
      - DEMO_BASE_URL=${DEMO_BASE_URL:-http://127.0.0.1:5010}
      - PORT=5000
    volumes:
      - .:/app
      - ./data:/data

volumes: {}
