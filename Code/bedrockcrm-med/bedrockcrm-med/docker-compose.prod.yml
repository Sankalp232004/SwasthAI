version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: swasthai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: swasthai
      POSTGRES_USER: swasthai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swasthai_secret_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swasthai -d swasthai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - swasthai-network

  # Flask Application - Production
  web:
    build: .
    container_name: swasthai-web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://swasthai:${POSTGRES_PASSWORD:-swasthai_secret_password}@db:5432/swasthai
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production-use-strong-key}
      - FLASK_ENV=production
    depends_on:
      db:
        condition: service_healthy
    command: gunicorn --bind 0.0.0.0:5000 --workers 4 --threads 2 --worker-class gthread --timeout 120 "app:create_app('production')"
    networks:
      - swasthai-network

volumes:
  postgres_data:

networks:
  swasthai-network:
    driver: bridge
